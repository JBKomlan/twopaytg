<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Lien de Transfert d'Argent Mobile Multi-Réseau</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; background: #eef2f3; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .section { border-left: 4px solid #007bff; padding: 10px 15px; margin-bottom: 20px; background: #f9f9f9; border-radius: 5px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .frais-container { display: flex; align-items: center; margin-top: 10px; background: #fff3cd; padding: 8px; border-radius: 8px; border: 1px solid #ffeeba; }
        .frais-container input { width: auto; margin-top: 0; margin-right: 10px; cursor: pointer; }
        button { width: 100%; background: #25D366; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 8px; transition: 0.3s; }
        button:hover { background: #128C7E; }
        #result { display: none; margin-top: 20px; padding: 15px; background: #f0fff4; border: 1px solid #25D366; border-radius: 10px; text-align: center; }
        .wa-link { display: inline-block; background: #075E54; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .error { color: #dc3545; font-size: 12px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Dashboard Multi-Réseau</h2>
    
    <label>📞 WhatsApp du Client</label>
    <input type="number" id="numClient" placeholder="Ex: 22890000000">

    <label>💰 Montant souhaité (FCFA)</label>
    <input type="number" id="montant" placeholder="Ex: 5000">
    
    <div class="frais-container">
        <input type="checkbox" id="addFrais">
        <label for="addFrais" style="margin-top:0; cursor:pointer;">Partage de frais (+1%)</label>
    </div>

    <div class="section">
        <label>🔵 Numéro Réception Mixx (T-Money)</label>
        <input type="number" id="numMixx" placeholder="Ex: 90112233">
        <div id="errMixx" class="error">Numéro Mixx inconnu.</div>
    </div>

    <div class="section" style="border-left-color: #ffc107;">
        <label>🟡 Numéro Réception Flooz (Moov)</label>
        <input type="number" id="numFlooz" placeholder="Ex: 98445566">
        <div id="errFlooz" class="error">Numéro Flooz inconnu.</div>
    </div>

    <button onclick="genererLien()">Générer le lien WhatsApp</button>

    <div id="result">
        <p style="color: #2e7d32; font-weight: bold;">Lien Multi-Paiement prêt !</p>
        <div id="waArea"></div>
    </div>
</div>

<script>
    // Chargement des numéros sauvegardés
    window.onload = function() {
        if(localStorage.getItem('savedMixx')) document.getElementById('numMixx').value = localStorage.getItem('savedMixx');
        if(localStorage.getItem('savedFlooz')) document.getElementById('numFlooz').value = localStorage.getItem('savedFlooz');
    };

    function validerReseau(numero, prefixes) {
        if (!numero) return true;
        const sNum = numero.toString();
        const hasPrefix = prefixes.some(p => sNum.startsWith(p));
        return sNum.length === 8 && hasPrefix;
    }

    function genererLien() {
        const client = document.getElementById('numClient').value.trim();
        let mt = parseFloat(document.getElementById('montant').value);
        const nMixx = document.getElementById('numMixx').value.trim();
        const nFlooz = document.getElementById('numFlooz').value.trim();
        const avecFrais = document.getElementById('addFrais').checked;

        document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

        const prefixesMixx = ['90', '91', '92', '93', '70', '71', '72'];
        const prefixesFlooz = ['98', '97', '96', '99', '79'];

        let isValid = true;
        if(nMixx && !validerReseau(nMixx, prefixesMixx)) {
            document.getElementById('errMixx').style.display = 'block';
            isValid = false;
        }
        if(nFlooz && !validerReseau(nFlooz, prefixesFlooz)) {
            document.getElementById('errFlooz').style.display = 'block';
            isValid = false;
        }

        if(!client || !mt || (!nMixx && !nFlooz) || !isValid) {
            alert("Veuillez remplir correctement les champs.");
            return;
        }

        // Sauvegarde des numéros de réception
        localStorage.setItem('savedMixx', nMixx);
        localStorage.setItem('savedFlooz', nFlooz);

        // --- GESTION DES FRAIS ET DU SUFFIXE ---
        const fraisCoche = avecFrais ? "1" : "0";
        if(avecFrais) {
            mt = Math.ceil(mt * 1.01); 
        }

        // --- CONFIGURATION ---
        const pseudoGithub = "jbkomlan"; 
        const nomProjet = "twopaytg"; 
        
        const baseUrl = "payer.html";
        const transferLink = `${baseUrl}?mt=${mt}&nmixx=${nMixx}&nflooz=${nFlooz}&f=${fraisCoche}`;
        
        const message = `Salut, pour votre transfert de ${mt} FCFA, choisissez votre réseau ici : ${transferLink}`;
        const waURL = `https://wa.me/${client}?text=${encodeURIComponent(message)}`;

        document.getElementById('waArea').innerHTML = `<a href="${waURL}" target="_blank" class="wa-link">📲 Envoyer via WhatsApp</a>`;
        document.getElementById('result').style.display = 'block';
    }
</script>
</body>
</html>
