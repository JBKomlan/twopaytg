<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser le Paiement</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 400px; margin: 20px auto; padding: 20px; background: #f4f7f6; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .amount-box { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 25px; padding: 15px; background: #e8f0fe; border-radius: 10px; }
        .btn-pay { display: block; width: 100%; padding: 18px; margin: 15px 0; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; color: white; transition: 0.2s; }
        .mixx { background: #007bff; }
        .flooz { background: #ffc107; color: #333; }
        .footer-note { font-size: 12px; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💳 Paiement Sécurisé</h2>
    <div class="amount-box" id="displayAmount">0 FCFA</div>
    
    <div id="buttonsArea"></div>

    <p class="footer-note">Le code USSD sera automatiquement préparé sur votre téléphone.</p>
</div>

<script>
    function getParams() {
        const urlParams = new URLSearchParams(window.location.search);
        return {
            montant: urlParams.get('mt'),
            mixx: urlParams.get('nmixx'),
            flooz: urlParams.get('nflooz'),
            fraisAppliques: urlParams.get('f') // "1" si coché, "0" sinon
        };
    }

    function initPaiement() {
        const { montant, mixx, flooz, fraisAppliques } = getParams();
        const area = document.getElementById('buttonsArea');
        
        if (!montant) {
            document.getElementById('displayAmount').innerHTML = "Lien invalide";
            return;
        }

        document.getElementById('displayAmount').innerHTML = `${montant} FCFA`;

        // Définition de la fin du code USSD
        // Si f=1 (coché), finit par 2#, sinon finit par 1#
        const suffixe = (fraisAppliques === "1") ? "2%23" : "1%23";

        // Bouton MIXX (T-Money)
        if (mixx && mixx !== "null") {
            // Syntaxe : *145*1*Montant*Numéro*FIN#
            const ussdMixx = `tel:*145*1*${montant}*${mixx}*${suffixe}`;
            area.innerHTML += `<a href="${ussdMixx}" class="btn-pay mixx">Payer par T-Money</a>`;
        }

        // Bouton FLOOZ (Moov)
        if (flooz && flooz !== "null") {
            // Syntaxe : *155*1*1*Numéro*Montant*FIN#
            const ussdFlooz = `tel:*155*1*1*${flooz}*${montant}*${suffixe}`;
            area.innerHTML += `<a href="${ussdFlooz}" class="btn-pay flooz">Payer par Flooz</a>`;
        }
    }

    window.onload = initPaiement;
</script>

</body>
</html>
