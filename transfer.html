<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransferLink TG — Paiement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.4s ease both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

        .amount-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }
        .amount-value {
            font-family: 'DM Mono', monospace;
            font-size: 34px;
            font-weight: 500;
            color: #58a6ff;
            letter-spacing: -0.02em;
        }
        .amount-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }

        .pay-options { display: flex; flex-direction: column; gap: 12px; }

        .pay-row { display: flex; align-items: stretch; gap: 8px; }

        .btn-pay {
            flex-grow: 1;
            display: block;
            padding: 16px 18px;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: opacity 0.2s, transform 0.1s;
            color: white;
            text-align: left;
            line-height: 1.3;
        }
        .btn-pay:active { transform: scale(0.97); }

        .btn-pay-sub { display: block; font-size: 11px; font-weight: 400; opacity: 0.8; margin-top: 3px; font-family: 'DM Mono', monospace; }

        .btn-copy {
            display: none;
            width: 50px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }
        .btn-copy:active { transform: scale(0.93); }

        .hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 20px;
            line-height: 1.6;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text);
            text-align: center;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            position: fixed;
            z-index: 99;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.5s 2.3s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="card" id="app">
    <!-- injecté depuis config.json -->
</div>

<div id="toast"></div>

<script>
    const params = new URLSearchParams(window.location.search);

    fetch('config.json')
        .then(r => r.json())
        .then(cfg => initPayer(cfg));

    function initPayer(cfg) {
        const mt = params.get('mt');
        const fraisParam = params.get(cfg.frais.paramUrl);
        const ui = cfg.ui.paiement;

        // Générer les codes USSD et les boutons pour chaque réseau
        const codesUssd = {};
        const boutonsHTML = cfg.reseaux.map(r => {
            const numVal = params.get(r.paramUrl);
            if (!numVal || numVal === 'null' || numVal === '') return '';

            const suffixe = (fraisParam === cfg.frais.valeurActive)
                ? r.ussd.suffixeAvecFrais
                : r.ussd.suffixeSansFrais;

            let code;
            if (r.ussd.repetitionNumero) {
                // Ex: Flooz — le numéro est répété dans le code
                code = `${r.ussd.debut}*${numVal}*${numVal}*${mt}*${suffixe}`;
            } else {
                // Ex: Mixx
                code = `${r.ussd.debut}*${mt}*${numVal}*${suffixe}`;
            }
            codesUssd[r.id] = code;

            const telUrl = `tel:${code.replace(/#/g, '%23')}`;
            const couleurTexte = r.couleurTexte ? r.couleurTexte : 'white';
            const svgColor = r.couleurTexte ? r.couleur : 'white';

            return `
                <div id="row_${r.id}" class="pay-row">
                    <a href="${telUrl}" id="link_${r.id}" class="btn-pay"
                       style="background:${r.couleur}; color:${couleurTexte}; box-shadow: 0 4px 16px ${r.couleurOmbre};"
                       onclick="showCopy('copy_${r.id}')">
                        ${r.labelBouton}
                        <span class="btn-pay-sub">→ ${numVal}</span>
                    </a>
                    <div id="copy_${r.id}" class="btn-copy"
                         onclick="copyUssd('${r.id}')"
                         style="border-color: ${r.couleur};">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${r.couleur}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('app').innerHTML = `
            <h2>${ui.titre}</h2>
            <div class="amount-box">
                <div class="amount-value">${mt ? mt + ' ' + cfg.monnaie.symbole : '—'}</div>
                <div class="amount-label">${ui.labelMontant}</div>
            </div>
            <div class="pay-options">${boutonsHTML}</div>
            <p class="hint" id="hint">${ui.hintInitial}</p>
        `;

        // Fonctions globales
        window.showCopy = function(id) {
            document.getElementById(id).style.display = 'flex';
            document.getElementById('hint').innerText = cfg.ui.paiement.hintApresClick;
        };

        window.copyUssd = function(reseauId) {
            const code = codesUssd[reseauId];
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                const toast = document.getElementById('toast');
                toast.textContent = cfg.ui.paiement.toastCopie;
                toast.className = 'show';
                setTimeout(() => { toast.className = ''; }, 3000);
            });
        };
    }
</script>
</body>
</html>
